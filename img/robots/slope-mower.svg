<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Illustration: remote-operated tracked slope mower">
  <defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3F7FC"/><stop offset="1" stop-color="#E6EEF7"/></linearGradient></defs>
  <rect width="400" height="300" fill="url(#s)"/>
  <!-- embankment -->
  <path d="M0 300 L0 250 L400 120 L400 300 Z" fill="#B9D6A5"/>
  <path d="M0 250 L400 120" stroke="#8DB674" stroke-width="4"/>
  <g stroke="#8DB674" stroke-width="3" stroke-linecap="round"><path d="M40 270l-3-10M60 262l2-11M330 170l-3-10M352 164l2-11"/></g>
  <g transform="rotate(-18 210 190)">
    <!-- tracks -->
    <rect x="110" y="190" width="200" height="36" rx="18" fill="#13243D"/>
    <g fill="#5B7090"><circle cx="130" cy="208" r="11"/><circle cx="290" cy="208" r="11"/><circle cx="170" cy="210" r="7"/><circle cx="210" cy="210" r="7"/><circle cx="250" cy="210" r="7"/></g>
    <!-- body -->
    <path d="M120 190 L140 140 L290 140 L304 190 Z" fill="#E8EDF3" stroke="#13243D" stroke-width="3" stroke-linejoin="round"/>
    <path d="M150 150 L280 150 L290 180 L140 180 Z" fill="#1660CE"/>
    <rect x="170" y="156" width="56" height="8" rx="4" fill="#FFFFFF" opacity="0.85"/>
    <!-- engine cover + exhaust -->
    <rect x="232" y="122" width="44" height="20" rx="4" fill="#2A3647" stroke="#13243D" stroke-width="2"/>
    <rect x="262" y="108" width="6" height="16" rx="2" fill="#13243D"/>
    <!-- deck -->
    <rect x="84" y="210" width="40" height="18" rx="4" fill="#2A3647" stroke="#13243D" stroke-width="2"/>
    <circle cx="160" cy="132" r="5" fill="#F2A33A" stroke="#13243D" stroke-width="2"/>
  </g>
  <!-- remote -->
  <g transform="translate(44 70)">
    <rect width="64" height="40" rx="10" fill="#13243D"/>
    <circle cx="16" cy="20" r="7" fill="#5B7090"/><circle cx="48" cy="20" r="7" fill="#5B7090"/>
    <path d="M32 0 L32 -16" stroke="#13243D" stroke-width="3" stroke-linecap="round"/>
    <g fill="none" stroke="#1660CE" stroke-width="2.5" stroke-linecap="round"><path d="M76 4q10 10 0 20"/><path d="M86 -2q16 16 0 32"/></g>
  </g>
</svg>
