<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Rivet — Find a solution</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
    @keyframes r-spin { to { transform: rotate(360deg); } }
    #video-preview-wrap:fullscreen, #video-preview-wrap:-webkit-full-screen { background: #000; display: flex; align-items: center; justify-content: center; }
    #video-preview-wrap:fullscreen video, #video-preview-wrap:-webkit-full-screen video { width: auto; height: auto; max-width: 100%; max-height: 100%; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_placeholder">Loading Rivet — Find a solution...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script src="../js/rivet-config.js"></script>
  <script src="../js/rivet-auth.js"></script>
  <script src="../js/rivet-api.js"></script>
  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  
  <script>
  // Prevent native form submission (which does a full page navigation/reload)
  // site-wide, and implement Enter-to-submit via a plain data attribute -
  // this template compiler only supports sc-camel-on-click/-change as real
  // event bindings, so keydown/submit handlers are wired here instead of in
  // the component template.
  document.addEventListener('submit', function (e) { e.preventDefault(); }, true);
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var id = e.target && e.target.getAttribute && e.target.getAttribute('data-enter-submit');
    if (!id) return;
    var btn = document.getElementById(id);
    if (btn) { e.preventDefault(); btn.click(); }
  }, true);
  // Video Input tab: drag-and-drop support. The uploader's real control is
  // a native <input type="file"> (sc-camel-on-change is the only working
  // custom event binding in this compiled runtime), so a drop just hands
  // the dropped file to that input via DataTransfer and fires a real
  // 'change' event -- same trick as the Enter-to-send button.click() above.
  document.addEventListener('dragover', function (e) {
    if (e.target && e.target.closest && e.target.closest('[data-video-drop-zone]')) { e.preventDefault(); }
  }, true);
  document.addEventListener('drop', function (e) {
    var zone = e.target && e.target.closest && e.target.closest('[data-video-drop-zone]');
    if (!zone) return;
    e.preventDefault();
    var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!file) return;
    var input = document.getElementById('video-file-in');
    if (!input) return;
    try {
      var dt = new DataTransfer();
      dt.items.add(file);
      input.files = dt.files;
      input.dispatchEvent(new Event('change', { bubbles: true }));
    } catch (err) {}
  }, true);
  // Video Input tab: sync the AI's detected boxes onto the video preview as
  // it plays. The component writes the per-frame box data (already computed
  // from Gemini's analysis, same data used for the sampled-frame thumbnails)
  // as a base64 JSON blob on #video-box-overlay's data-frames-b64 attribute,
  // since this compiled runtime has no real binding for video timeupdate.
  // We pick the sampled frame whose timestamp is closest to the current
  // playback time and draw its boxes (no extra Gemini calls, no new data).
  function __rivetEscHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function __rivetB64ToStr(b64) {
    try { return decodeURIComponent(escape(atob(b64))); } catch (e) { return ''; }
  }
  function __rivetVideoContentBox(videoEl, wrapEl) {
    if (!videoEl || !wrapEl) return null;
    var vr = videoEl.getBoundingClientRect(), wr = wrapEl.getBoundingClientRect();
    var cw = vr.width, ch = vr.height;
    if (!cw || !ch) return null;
    var outerLeft = vr.left - wr.left, outerTop = vr.top - wr.top;
    var iw = videoEl.videoWidth, ih = videoEl.videoHeight;
    if (!iw || !ih) return { left: outerLeft, top: outerTop, width: cw, height: ch };
    var videoRatio = iw / ih, boxRatio = cw / ch;
    var width, height, left, top;
    if (boxRatio > videoRatio) { height = ch; width = ch * videoRatio; top = 0; left = (cw - width) / 2; }
    else { width = cw; height = cw / videoRatio; left = 0; top = (ch - height) / 2; }
    return { left: outerLeft + left, top: outerTop + top, width: width, height: height };
  }
  function __rivetRenderVideoOverlay(videoEl) {
    var overlay = document.getElementById('video-box-overlay');
    var wrap = document.getElementById('video-preview-wrap');
    var bar = document.getElementById('video-ctrl-bar');
    if (!overlay || !videoEl) return;
    var box = __rivetVideoContentBox(videoEl, wrap);
    if (box) {
      overlay.style.left = box.left + 'px';
      overlay.style.top = box.top + 'px';
      overlay.style.width = box.width + 'px';
      overlay.style.height = box.height + 'px';
      // Keep the control bar riding the video's own bottom edge rather than
      // the wrapper's -- in fullscreen the wrapper fills the whole screen
      // while the (correctly letterboxed) video is smaller and centered, so
      // anchoring the bar to the wrapper's bottom leaves it stranded below
      // the video with an empty gap in between.
      if (bar && wrap) {
        var wrapRect = wrap.getBoundingClientRect();
        bar.style.left = box.left + 'px';
        bar.style.width = box.width + 'px';
        bar.style.right = 'auto';
        bar.style.bottom = Math.max(0, wrapRect.height - (box.top + box.height)) + 'px';
      }
    }
    var raw = overlay.getAttribute('data-frames-b64') || '';
    var frames;
    try { frames = JSON.parse(__rivetB64ToStr(raw) || '[]'); } catch (e) { frames = []; }
    if (!frames || !frames.length) { overlay.innerHTML = ''; return; }
    var t = (typeof videoEl.currentTime === 'number') ? videoEl.currentTime : 0;
    var best = frames[0], bestDiff = Math.abs((frames[0].t || 0) - t);
    for (var i = 1; i < frames.length; i++) {
      var d = Math.abs((frames[i].t || 0) - t);
      if (d < bestDiff) { best = frames[i]; bestDiff = d; }
    }
    var html = '';
    (best.boxes || []).forEach(function (b) {
      html += '<div style="' + (b.style || '') + '"></div>';
      html += '<div style="' + (b.labelStyle || '') + '">' + __rivetEscHtml(b.label) + '</div>';
    });
    overlay.innerHTML = html;
  }
  ['timeupdate', 'seeked', 'loadedmetadata', 'play'].forEach(function (evt) {
    document.addEventListener(evt, function (e) {
      if (e.target && e.target.id === 'video-preview-el') { __rivetRenderVideoOverlay(e.target); }
    }, true);
  });
  // Chrome does not honor controlslist="nofullscreen" (confirmed live --
  // the native fullscreen button still renders regardless), so hiding it
  // and adding our own button left two fullscreen-looking controls side by
  // side. Native video fullscreen also only promotes the <video> element
  // itself, leaving the sibling AI-box overlay behind, and redirecting that
  // request after the fact (exit then re-request, or swapping mid-flight)
  // is unreliable -- it either gets rejected (losing the user gesture) or
  // leaves the video stretched/distorted. So instead: no native controls at
  // all, just one small custom bar (play, time, seek, mute, fullscreen)

font-family: Castellar, Cinzel, 'Times New Roman', serif; font-weight: 700; font-size: 20px; letter-spacing: 0.22em; color: #D3D9E2\">RIVET</span>\n</a>\n<nav aria-label=\"Main\" style=\"display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; font-size: 15px; font-weight: 600\">\n<a href=\"#top\" aria-current=\"page\" style=\"display: flex; align-items: center; justify-content: center; min-height: 64px; padding: 0 12px; color: #D3D9E2; font-weight: 700; border-bottom: 2px solid #D3D9E2; box-sizing: border-box\">Find a solution</a>\n<a href=\"engineers.html\" style=\"display: flex; align-items: center; justify-content: center; min-height: 64px; padding: 0 12px\">For engineers</a><a href=\"messages.html\" style=\"display: flex; align-items: center; justify-content: center; min-height: 64px; padding: 0 12px\">Messages</a>\n<a href=\"login.html\" style=\"display: flex; align-items: center; justify-content: center; min-height: 64px; padding: 0 12px\">Log in</a></nav>\n</div>\n</header>\n\n<sc-if value=\"{{toast}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 999px; background: rgba(74, 86, 104, 0.94); color: #F3F5F8; font-size: 14px; font-weight: 600; box-shadow: 0 6px 20px rgba(11, 22, 38, 0.18)\">\n<svg aria-hidden=\"true\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z\"></path></svg>\nChat with Rivet on the right to post your bounty\n</div>\n</sc-if>\n\n<div id=\"top\" style=\"width: 92%; margin: 0 auto; padding: 28px clamp(16px, 3vw, 32px) 64px; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<h1 style=\"margin: 0; font-family: Castellar, Cinzel, 'Times New Roman', serif; font-weight: 700; font-size: 32px; letter-spacing: 0.03em; line-height: 1.15\">What should a robot take off your plate?</h1>\n<p style=\"margin: 0; color: #4A5668; font-size: 15px\">Tell the assistant about the job. Matching robots and bounties show up on the left as you chat.</p>\n</div>\n\n<!-- FILTERS (TOP) -->\n<section aria-labelledby=\"flt-h\" style=\"display: flex; flex-direction: column; gap: 8px; padding: 12px 18px; background: #FFFFFF; border: 1px solid #E3E7ED; border-radius: 10px\">\n<div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap\">\n<span style=\"display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap\"><h2 id=\"flt-h\" style=\"margin: 0; font-family: Castellar, Cinzel, 'Times New Roman', serif; font-size: 14px; font-weight: 700; letter-spacing: 0.06em\">Filters</h2><span style=\"font-size: 12px; color: #4A5668\">The assistant sets these from your answers. Tap any to change it.</span></span>\n<button type=\"button\" sc-camel-on-click=\"{{resetFilters}}\" style=\"min-height: 30px; padding: 0 6px; border: 0; background: transparent; color: #1F5FBF; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer\">Reset</button>\n</div>\n<div class=\"r-scroll\" style=\"display: flex; gap: 16px; overflow-x: auto; padding-bottom: 4px\">\n<sc-for list=\"{{filterRows}}\" as=\"row\" hint-placeholder-count=\"6\">\n<div role=\"group\" aria-label=\"{{row.label}}\" style=\"flex: none; display: flex; align-items: center; gap: 6px\">\n<span style=\"font-size: 12px; font-weight: 700; color: #4A5668\">{{row.label}}</span>\n<sc-for list=\"{{row.opts}}\" as=\"o\" hint-placeholder-count=\"3\">\n<sc-if value=\"{{o.on}}\" hint-placeholder-val=\"{{ false }}\">\n<button type=\"button\" aria-pressed=\"true\" sc-camel-on-click=\"{{o.pick}}\" style=\"flex: none; min-height: 30px; padding: 0 11px; border: 1px solid #13243D; border-radius: 999px; background: #13243D; color: #D3D9E2; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap\">{{o.label}}</button>\n</sc-if>\n<sc-if value=\"{{o.off}}\" hint-placeholder-val=\"{{ true }}\">\n<button type=\"button\" aria-pressed=\"false\" class=\"r-opt\" sc-camel-on-click=\"{{o.pick}}\" style=\"flex: none; min-height: 30px; padding: 0 11px; border: 1px solid #CBD3DE; border-radius: 999px; background: #FFFFFF; color: #2A3647; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap\">{{o.label}}</button>\n</sc-if>\n</sc-for>\n<span aria-hidden=\"true\" style=\"width: 1px; height: 20px; background: #CBD3DE; margin-left: 8px\"></span>\n</div>\n</sc-for>\n</div>\n</section>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n\n<!-- LEFT: RESULTS + BOUNTIES -->\n<main style=\"flex: 999 1 58%; min-width: 0; display: flex; flex-direction: column; gap: 14px\">\n\n<!-- EMPTY STATE -->\n<sc-if value=\"{{inactive}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #EEF4FC; border: 1px solid #C9DAF2; border-radius: 10px; font-size: 14px; color: #13243D\">\n<svg aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1660CE\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 11v5M12 8h.01\"></path></svg>\n<span><strong>Describe your job to the assistant on the right.</strong> It searches the web for robots that fit and ranks them here by fit and payback.</span>\n</div>\n</sc-if>\n\n<!-- MATCHES -->\n<sc-if value=\"{{ true }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<sc-if value=\"{{hasAgentStatus}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; background: #EEF4FC; border: 1px solid #C9DAF2; border-radius: 10px; font-size: 14px; color: #13243D\">\n<div style=\"display: flex; gap: 6px; flex-wrap: wrap\">\n<sc-for list=\"{{agentSteps}}\" as=\"st\" hint-placeholder-count=\"4\">\n<span style=\"{{st.style}}\">{{st.label}}</span>\n</sc-for>\n</div>\n<span>{{agentStatus}}</span>\n</div>\n</sc-if>\n\n<!-- WORKFLOW: the job, step by step -->\n<sc-if value=\"{{hasWorkflow}}\" hint-placeholder-val=\"{{ false }}\">\n<section aria-labelledby=\"wf-h\" style=\"display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; background: #FFFFFF; border: 1px solid #E3E7ED; border-radius: 10px\">\n<div style=\"display: flex; flex-direction: column; gap: 2px\">\n<h2 id=\"wf-h\" style=\"margin: 0; font-family: Castellar, Cinzel, 'Times New Roman', serif; font-size: 22px; font-weight: 700; letter-spacing: 0.03em\">Your job, step by step</h2>\n<span style=\"font-size: 16px; font-weight: 800; color: #1660CE\">{{wfHeadline}}</span>\n<span style=\"font-size: 13px; color: #4A5668\">{{wfSub}}</span>\n</div>\n<div class=\"r-scroll\" style=\"overflow-x: auto\">\n<div role=\"table\" aria-label=\"Steps of the job\" style=\"min-width: 760px; display: flex; flex-direction: column; font-size: 13px\">\n<div role=\"row\" style=\"display: grid; grid-template-columns: minmax(170px, 2.2fr) minmax(130px, 1.3fr) minmax(150px, 1.3fr) 60px 90px minmax(130px, auto); column-gap: 12px; align-items: start; padding: 6px 0 8px; color: #4A5668; font-size: 11px; font-weight: 700; letter-spacing: 0.06em\">\n<span role=\"columnheader\">STEP</span>\n<span role=\"columnheader\">SHARE OF THE WEEK</span>\n<span role=\"columnheader\">ROBOT TODAY?</span>\n<span role=\"columnheader\" style=\"text-align: right\">ROBOTS</span>\n<span role=\"columnheader\" style=\"text-align: right\">BEST PAYBACK</span>\n<span role=\"columnheader\"><span class=\"sr-only\">Actions</span></span>\n</div>\n<sc-for list=\"{{stepRows}}\" as=\"r\" hint-placeholder-count=\"4\">\n<div role=\"row\" style=\"{{r.rowStyle}}\">\n<div role=\"cell\" style=\"display: flex; flex-direction: column; gap: 2px\">\n<span style=\"font-size: 14px; font-weight: 800; color: #0B1626\">{{r.num}}. {{r.name}}</span>\n<span style=\"font-size: 12px; color: #4A5668\">{{r.why}}</span>\n</div>\n<div role=\"cell\" style=\"display: flex; align-items: center; gap: 8px\">\n<input type=\"range\" min=\"0\" max=\"100\" step=\"5\" value=\"{{r.share}}\" sc-camel-on-change=\"{{r.setShare}}\" aria-label=\"{{r.sliderLabel}}\" style=\"flex: 1 1 auto; min-width: 70px; accent-color: #1660CE\">\n<span style=\"flex: none; width: 38px; text-align: right; font-weight: 800; font-variant-numeric: tabular-nums\">{{r.shareLabel}}</span>\n</div>\n<div role=\"cell\"><span style=\"{{r.chipStyle}}\">{{r.verdict}}</span></div>\n<div role=\"cell\" style=\"text-align: right; font-weight: 800; font-variant-numeric: tabular-nums\">{{r.robots}}</div>\n<div role=\"cell\" style=\"text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; color: #1660CE\">{{r.payback}}</div>\n<div role=\"cell\" style=\"display: flex; justify-content: flex-end; gap: 6px; flex-wrap: wrap\">\n<sc-if value=\"{{r.canShow}}\" hint-placeholder-val=\"{{ true }}\">\n<button type=\"button\" class=\"r-ghost\" sc-camel-on-click=\"{{r.show}}\" style=\"min-height: 32px; padding: 0 12px; border: 1px solid #CBD3DE; border-radius: 999px; background: #FFFFFF; color: #13243D; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap\">{{r.showLabel}}</button>\n</sc-if>\n<sc-if value=\"{{r.canBounty}}\" hint-placeholder-val=\"{{ false }}\">\n<button type=\"button\" class=\"r-blue\" sc-camel-on-click=\"{{r.bounty}}\" style=\"min-height: 32px; padding: 0 12px; border: 0; border-radius: 999px; background: #1660CE; color: #E4E8EE; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap\">Start a bounty</button>\n</sc-if>\n<sc-if value=\"{{r.canCheck}}\" hint-placeholder-val=\"{{ false }}\">\n<button type=\"button\" class=\"r-ghost\" sc-camel-on-click=\"{{r.check}}\" style=\"min-height: 32px; padding: 0 12px; border: 1px solid #13243D; border-radius: 999px; background: #FFFFFF; color: #13243D; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap\">Check for robots</button>\n</sc-if>\n</div>\n</div>\n</sc-for>\n</div>\n</div>\n</section>\n</sc-if>\n\n<div style=\"display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap\">\n<div style=\"display: flex; flex-direction: column; gap: 2px; min-width: 0\">\n<h2 style=\"margin: 0; font-family: Castellar, Cinzel, 'Times New Roman', serif; font-size: 22px; font-weight: 700; letter-spacing: 0.03em\">Top matches</h2>\n<span style=\"font-size: 14px; color: #4A5668\">For \u201c{{query}}\u201d \u00b7 {{matchNote}}</span>\n</div>\n<sc-if value=\"{{hasStepFilter}}\" hint-placeholder-val=\"{{ false }}\">\n<button type=\"button\" sc-camel-on-click=\"{{clearStepFilter}}\" style=\"min-height: 30px; padding: 0 6px; border: 0; background: transparent; color: #1F5FBF; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer\">Show all steps</button>\n</sc-if>\n</div>\n\n<sc-if value=\"{{noMatches}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 20px; background: #FFFFFF; border: 1px solid #E3E7ED; border-radius: 10px\">\n<span style=\"flex: 1 1 60%; font-size: 15px; color: #2A3647\"><strong style=\"color: #0B1626\">No robot on the market fits this yet.</strong> Back a bounty with companies that need the same thing, or start your own.</span>\n<a href=\"#bounties\" class=\"r-blue\" style=\"display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 8px; background: #1660CE; color: #E4E8EE; text-decoration: none; font-weight: 700; font-size: 14px\">Go to bounties</a>\n</div>\n</sc-if>\n\n<sc-for list=\"{{matchGroups}}\" as=\"g\" hint-placeholder-count=\"2\">\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<h3 style=\"margin: 4px 0 0; font-size: 13px; font-weight: 800; letter-spacing: 0.04em; color: #4A5668\">{{g.title}}</h3>\n<sc-for list=\"{{g.robots}}\" as=\"b\" hint-placeholder-count=\"2\">\n<article style=\"display: flex; flex-wrap: wrap; gap: 18px; padding: 18px; background: #FFFFFF; border: 1px solid #E3E7ED; border-radius: 10px\">\n<sc-if value=\"{{b.hasImg}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"flex: 0 0 22%; aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; border: 1px solid #E3E7ED; border-radius: 8px; background: #FFFFFF; overflow: hidden\">\n<img src=\"{{b.img}}\" alt=\"{{b.imgAlt}}\" sc-camel-referrer-policy=\"no-referrer\" loading=\"lazy\" style=\"display: block; max-width: 100%; max-height: 100%; object-fit: contain\">\n</div>\n</sc-if>\n<sc-if value=\"{{b.noImg}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"flex: 0 0 22%; aspect-ratio: 4 / 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border: 1.5px dashed #A3AEBD; border-radius: 8px; background: #F7F8FA; color: #4A5668; font-size: 12px; text-align: center\">\n<svg aria-hidden=\"true\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"></rect><circle cx=\"9\" cy=\"10\" r=\"1.8\"></circle><path d=\"M21 16l-5-5-8 8\"></path></svg>\n<span style=\"font-weight: 700; color: #2A3647\">No photo on the vendor page</span>\n</div>\n</sc-if>\n<div style=\"flex: 1 1 60%; min-width: 0; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start\">\n<div style=\"display: flex; gap: 12px; align-items: baseline\">\n<span style=\"font-family: Castellar, Cinzel, 'Times New Roman', serif; font-size: 22px; font-weight: 700; color: #8794A6\">#{{b.rank}}</span>\n<span style=\"display: flex; flex-direction: column\"><h3 style=\"margin: 0; font-size: 18px; font-weight: 800\">{{b.name}}</h3><span style=\"font-size: 14px; color: #4A5668\">{{b.vendor}} \u00b7 {{b.category}}</span></span>\n</div>\n<span style=\"padding: 3px 10px; border-radius: 6px; background: #EEF1F5; font-size: 12px; font-weight: 700; color: #2A3647\">{{b.status}}</span>\n</div>\n<dl style=\"margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(120px, 100%), 1fr)); gap: 10px\">\n<div><dt style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #4A5668\">PRICE / MACHINE</dt><dd style=\"margin: 2px 0 0; font-weight: 800; font-variant-numeric: tabular-nums\">{{b.price}}</dd></div>\n<div><dt style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #4A5668\">RUNNING / YR</dt><dd style=\"margin: 2px 0 0; font-weight: 800; font-variant-numeric: tabular-nums\">{{b.run}}</dd></div>\n<div><dt style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #4A5668\">NET SAVING / YR</dt><dd style=\"margin: 2px 0 0; font-weight: 800; font-variant-numeric: tabular-nums\">{{b.net}}</dd></div>\n<div><dt style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #4A5668\">PAYBACK</dt><dd style=\"margin: 2px 0 0; font-weight: 800; font-variant-numeric: tabular-nums; color: #1660CE\">{{b.payback}}</dd></div>\n</dl>\n<sc-if value=\"{{b.hasFit}}\" hint-placeholder-val=\"{{ true }}\">\n<p style=\"margin: 0; font-size: 13px; font-weight: 600; color: #2A3647\">{{b.fitLine}}</p>\n</sc-if>\n<p style=\"margin: 0; font-size: 14px; color: #2A3647\">{{b.source}}</p>\n<sc-if value=\"{{b.hasNotes}}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin: 0; font-size: 12px; color: #4A5668\">{{b.notes}}</p>\n</sc-if>\n<sc-if value=\ lay: flex; flex-direction: column; gap: 10px; padding: 14px; background: #EFFBF4; border: 1px solid #BFE6CF; border-radius: 10px\">\n<span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #1D6B3C\">ROI RANGE \u2014 AUTOMATE {{excelRoiProcess}}</span>\n<div style=\"display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px\">\n<span style=\"color: #4A5668\">Current annual cost of this process</span>\n<span style=\"font-weight: 700; color: #0B1626; text-align: right\">{{excelRoiCurrentCost}}</span>\n<span style=\"color: #4A5668\">Your current net profit</span>\n<span style=\"font-weight: 700; color: #0B1626; text-align: right\">{{excelRoiCurrentProfit}}</span>\n</div>\n<div style=\"border-top: 1px solid #BFE6CF; margin: 2px 0\"></div>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: #4A5668\">CONSERVATIVE ESTIMATE</span>\n<div style=\"display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; font-size: 13px\">\n<span style=\"color: #4A5668\">Direct labor savings ({{excelRoiLowLaborRate}})</span>\n<span style=\"font-weight: 600; color: #1D6B3C; text-align: right\">\u2212 {{excelRoiLowLabor}}/yr</span>\n<span style=\"color: #4A5668; font-weight: 600\">Extra profit per year</span>\n<span style=\"font-weight: 800; color: #1D6B3C; font-size: 14px; text-align: right\">+{{excelRoiProfitGainLow}}/yr</span>\n</div>\n</div>\n<div style=\"border-top: 1px solid #BFE6CF; margin: 2px 0\"></div>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: #1D6B3C\">OPTIMISTIC ESTIMATE</span>\n<div style=\"display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; font-size: 13px\">\n<span style=\"color: #4A5668\">Direct labor savings ({{excelRoiHighLaborRate}})</span>\n<span style=\"font-weight: 600; color: #1D6B3C; text-align: right\">\u2212 {{excelRoiHighLabor}}/yr</span>\n<span style=\"color: #4A5668\">Insurance + benefits reduction</span>\n<span style=\"font-weight: 600; color: #1D6B3C; text-align: right\">\u2212 {{excelRoiHighInsurance}}/yr</span>\n<span style=\"color: #4A5668\">Capacity uplift ({{excelRoiHighCapacityRev}} new revenue)</span>\n<span style=\"font-weight: 600; color: #1D6B3C; text-align: right\">+{{excelRoiHighCapacity}}/yr</span>\n<span style=\"color: #4A5668; font-weight: 600\">Extra profit per year</span>\n<span style=\"font-weight: 800; color: #1D6B3C; font-size: 14px; text-align: right\">+{{excelRoiProfitGainHigh}}/yr</span>\n</div>\n</div>\n<div style=\"border-top: 1px solid #BFE6CF; margin: 2px 0\"></div>\n<div style=\"display: flex; justify-content: space-between; align-items: center; padding: 6px 0\">\n<span style=\"font-size: 13px; font-weight: 700; color: #0B1626\">Annual ROI range</span>\n<span style=\"font-size: 15px; font-weight: 800; color: #1D6B3C\">+{{excelRoiProfitGainLow}} \u2013 +{{excelRoiProfitGainHigh}}/yr</span>\n</div>\n<span style=\"font-size: 11px; color: #4A5668; font-style: italic\">Conservative: 55% labor displacement only. Optimistic: 75% labor displacement + insurance/benefits savings + capacity uplift from freed hours. Actual ROI depends on the robot chosen.</span>\n</div>\n</sc-if>\n<sc-if value=\"{{excelHasCorrectedWorkbook}}\" hint-placeholder-val=\"{{ false }}\">\n<button type=\"button\" class=\"r-ghost\" sc-camel-on-click=\"{{downloadExcelCorrected}}\" style=\"min-height: 38px; padding: 0 14px; border: 1px solid #CBD3DE; border-radius: 999px; background: #FFFFFF; color: #13243D; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; align-self: flex-start\">Download corrected Excel</button>\n</sc-if>\n<span style=\"font-size: 12px; color: #4A5668\">Matches for this job are on the left.</span>\n</div>\n</sc-if>\n</div>\n</sc-if>\n</div>\n</sc-if>\n</aside>\n</div>\n</div>\n</div>\n</x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:2400}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {\n      panel: 'chat', first: '', ans: {}, log: [], draft: '',\n      f: { budget: 'any', payback: 'any', size: 'any', power: 'any', avail: 'now' }, safety: {},\n      fJob: '', fPeople: '', fHours: '', fHourly: '', fWeeks: '', fUnits: '', formOn: false,\n      videoName: '', videoObjUrl: null, videoStatus: 'idle', videoError: '', videoFrames: [], videoAnalysis: null, videoLightboxIndex: null, topic: '',\n      excelName: '', excelStatus: 'idle', excelError: '', excelExtraction: null, excelCorrectedWorkbook: null,\n      contacted: {}, req: false, title: '', gaps: {}, note: '', savings: '', pct: '30', mine: [], backed: {}, amts: {},\n      bflow: null, bsubject: '', bgap: '', bpledge: '', toast: false, aiOpening: null, aiOpeningLoading: false,\n      wf: null, agentBusy: false, agentErr: '', stepFilter: null, shareEdits: {},\n      bstep: null, bposting: false, bErr: '', formErr: ''\n    };\n    this._draft = null; this._timer = null; this._said = {}; this._shareTimers = {}; this._loaded = false;\n  }\n  // ---------- the Rivet agent (Convex + Apify), via js/rivet-api.js ----------\n  // Polls the job's workflow breakdown until every step's search has finished, then says\n  // the outcome once in the chat.\n  _watch(dr) {\n    const api = window.RivetApi;\n    clearInterval(this._timer);\n    const tick = () => api.latestWorkflow(dr.id).then((w) => {\n      if (!w) return;\n      this.setState({ wf: w, agentBusy: false });\n      const busy = w.status === 'splitting' || w.steps.some((x) => x.verdict === 'checking');\n      if (!busy) { clearInterval(this._timer); this._announce(w); }\n    }).catch(() => {});\n    tick();\n    this._timer = setInterval(tick, 1500);\n  }\n  _announce(w) {\n    const key = w._id + ':' + w.steps.map((x) => x.verdict).join(',');\n    if (this._said[key]) return;\n    this._said[key] = true;\n    const money = (v) => '$' + Math.round(v).toLocaleString('en-US');\n    const names = (v) => w.steps.filter((x) => x.verdict === v).map((x) => x.name.toLowerCase());\n    let text;\n    if (w.status === 'failed') text = 'I couldn\u2019t break that job down this time. Send another message to try again.';\n    else {\n      const sm = w.summary, today = names('today'), possible = names('possible');\n      text = 'I split this job into ' + sm.steps + ' steps (see the table on the left). ';\n      text += today.length\n        ? 'A robot can take over ' + today.join(', ') + ' today' + (sm.yearlySavings ? ', saving about ' + money(sm.yearlySavings) + ' a year' : '') + '. '\n        : 'No step has a robot on the market that fits yet. ';\n      if (possible.length) text += 'Nothing sold today does ' + possible.join(', ') + '; you can start a bounty for ' + (possible.length === 1 ? 'it' : 'them') + ' from the table. ';\n      text += w.laborCost === null && today.length\n        ? 'To work out savings, roughly what does this whole job cost you a year in labor? For example: $60,000.'\n        : 'If my time split is off, drag the sliders.';\n    }\n    this.setState({ log: this.state.log.concat([{ kind: 'ai', text: text.trim() }]) });\n  }\n  // The request this page last used (kept per browser), so your posted bounties show again\n  // after a reload. Ownership is still checked by the backend.\n  _requestKey() { const api = window.RivetApi; return 'rivet.findSolution.request.' + ((api && api.backend) || 'local'); }\n  _restore() {\n    const api = window.RivetApi;\n    let id = null;\n    try { id = JSON.parse(localStorage.getItem(this._requestKey()) || 'null'); } catch (e) { id = null; }\n    if (!api || typeof id !== 'string') return;\n    api.getMyBounties(id).then((rows) => {\n      if (!this._draft) this._draft = { id: id };\n      const saved = (rows || []).map((b) => ({ id: 'saved-' + b._id, title: b.title, pledged: b.pledged, goal: b.goal, backers: 1, closes: '90 days', spec: (b.specLines || []).join(' \u00b7 '), saved: true }));\n      this.setState({ mine: saved.concat(this.state.mine.filter((m) => !saved.some((x) => x.id === m.id))) });\n    }).catch(() => {});\n  }\n  renderVals() {\n    const s = this.state;\n    const money = (v) => '$' + Math.round(v).toLocaleString('en-US');\n    const num = (v) => { const x = parseFloat(v); return isNaN(x) ? 0 : x; };\n\n    // ---------- chat ----------\n    const Q = [\n      { id: 'where', text: 'Where does this work happen?', opts: ['Outdoor grounds', 'Building exterior', 'Indoors or warehouse', 'Roads or infrastructure'] },\n      { id: 'people', text: 'How many people do this job today?', opts: ['1\u20132', '3\u20135', '6\u201310', 'More than 10'] },\n      { id: 'hours', text: 'About how many hours a week does each of them spend on it?', opts: ['Under 10', '10\u201320', '20\u201340', 'Full time'] },\n      { id: 'cost', text: 'Roughly what does an hour of their time cost you, with taxes?', opts: ['About $20', 'About $25', 'About $30', '$40 or more'] },\n      { id: 'safety', text: 'Any safety concerns on site?', opts: ['People or pets nearby', 'Traffic', 'Heights', 'Chemicals', 'None'] },\n      { id: 'budget', text: 'What would you spend per machine?', opts: ['Under $25k', '$25k\u2013$50k', '$50k\u2013$100k', 'Not sure yet'] }\n    ];\n    const safetyMap = { 'People or pets nearby': 'people', 'Traffic': 'traffic', 'Heights': 'heights', 'Chemicals': 'chem' };\n    const budgetMap = { 'Under $25k': '25', '$25k\u2013$50k': '50', '$50k\u2013$100k': '100', 'Not sure yet': 'any' };\n    const answer = (q, label) => {\n      const nx = { ans: { ...this.state.ans, [q.id]: label } };\n      if (q.id === 'safety' && safetyMap[label]) nx.safety = { ...this.state.safety, [safetyMap[label]]: true };\n      if (q.id === 'budget') nx.f = { ...this.state.f, budget: budgetMap[label] };\n      this.setState(nx);\n    };\n    // /api/chat is for signed-in Client accounts: it gets the Clerk session token and checks it with Convex.\n    // Sign-in, role and limit refusals come back with a message for chat bubbles; the topic label\n    // just keeps the typed text (a refusal never becomes the label).\n    const askAI = (text, mode, cb) => {\n      const A = window.RivetAuth;\n      const say = (msg) => cb(mode === 'topic' ? null : msg);\n      Promise.resolve(A ? A.getToken() : null).then((token) => {\n        if (!token) return say('Log in with a Client account to chat with the Rivet assistant.');\n        return fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, body: JSON.stringify({ message: text, mode: mode }) })\n          .then((r) => r.json().catch(() => null).then((data) => {\n            if (r.ok && data && data.reply) return cb(data.reply);\n            say([401, 403, 429].indexOf(r.status) !== -1 && data && data.message ? data.message : null);\n          }));\n      }).catch(() => cb(null));\n    }; const msgs = [{ kind: 'ai', text: 'Hi, I\u2019m the Rivet assistant. Tell me about a job you\u2019d like a robot to take on. Matches show up on the left as we go.' }];\n    let next = null;\n    if (s.first) {\n      msgs.push({ kind: 'me', text: s.first });\n      msgs.push({ kind: 'ai', text: s.aiOpeningLoading ? 'Thinking\u2026' : (s.aiOpening || 'Rivet AI is unavailable right now \u2014 send that again in a moment to retry.') });\n    }\n    s.log.forEach((m) => msgs.push(m));\n\n    // ---------- numbers ----------\n    const pMap = { '1\u20132': 2, '3\u20135': 4, '6\u201310': 8, 'More than 10': 12 };\n    const hMap = { 'Under 10': 8, '10\u201320': 15, '20\u201340': 30, 'Full time': 40 };\n    const cMap = { 'About $20': 20, 'About $25': 25, 'About $30': 30, '$40 or more': 40 };\n    let people, hours, hourly, weeks, units, fromForm = s.formOn;\n    if (fromForm) { people = num(s.fPeople); hours = num(s.fHours); hourly = num(s.fHourly); weeks = num(s.fWeeks); units = num(s.fUnits); }\n    else { people = pMap[s.ans.people] || 0; hours = hMap[s.ans.hours] || 0; hourly = cMap[s.ans.cost] || 0; weeks = 50; units = people ? Math.max(1, Math.round(people / 2)) : 0; }\n    const labor = people * hours * hourly * weeks;\n    const haveNums = labor > 0 && units > 0;\n\n    const query = (fromForm ? s.fJob : s.first) || '';\n    const topicText = (!fromForm && s.topic) ? s.topic : query;\n    const qt = topicText.toLowerCase();\n    const active = !!s.first || s.formOn;\n    const isMowing = /mow|lawn|grass|turf|landscap|yard/.test(qt);\n\n    // ---------- bounty via chat ----------\n    const GAPS = ['Too expensive', 'Doesn\u2019t do the whole job', 'Can\u2019t handle slopes', 'Too big to move between sites', 'Not safe around people'];\n    const gapSpec = { 'Too expensive': 'Pays back within 2 years at your labor cost', 'Doesn\u2019t do the whole job': 'Handles the full job without a person following it', 'Can\u2019t handle slopes': 'Works on slopes up to 20\u00b0', 'Too big to move between sites': 'Travels between sites on a standard trailer', 'Not safe around people': 'Stops for people and pets' };\n    const PLEDGES = ['$2,500', '$5,000', '$10,000', 'Not sure yet'];\n    const startB = (subj) => {\n      this.setState({ bflow: 'open', bstep: null, bsubject: subj, bgap: '', bpledge: '', bErr: '', panel: 'chat', toast: true });\n      setTimeout(() => this.setState({ toast: false }), 3200);\n      try { const el = document.getElementById('assistant'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}\n    };\n    const W = s.wf;\n    const wsteps = W ? W.steps : [];\n    const bStepRow = s.bstep !== null ? wsteps.find((x) => x.index === s.bstep) || null : null;\n    const bTitle = (bStepRow ? 'Robot to ' + bStepRow.name.toLowerCase() + (topicText ? ' (' + topicText + ')' : '') : query ? 'Robot for: ' + query : 'Custom robot request').slice(0, 160);\n    const bSpec = ['Takes over: ' + (bStepRow ? bStepRow.name : (query || 'the job you described'))]\n      .concat(bStepRow && bStepRow.annualCost ? ['This step costs us about ' + money(bStepRow.annualCost) + ' a year in labor'] : [])\n      .concat(s.bgap ? [gapSpec[s.bgap] || s.bgap] : []).map((x) => x.slice(0, 300));\n    let bOpts = null;\n    if (s.bflow) {\n      msgs.push({ kind: 'ai', text: bStepRow ? 'Let\u2019s start a bounty for \u201c' + bStepRow.name + '\u201d. What\u2019s missing from robots today?' : (s.bsubject ? 'Not quite right with ' + s.bsubject + '? ' : 'Nothing fits? ') + 'I can post a bounty for you. What\u2019s missing from the robots you\u2019ve seen?' });\n      if (!s.bgap) bOpts = GAPS.map((g) => ({ label: g, pick: () => this.setState({ bgap: g }) }));\n      else {\n        msgs.push({ kind: 'me', text: s.bgap });\n        msgs.push({ kind: 'ai', text: 'Got it. How much would you pledge toward getting it built? You\u2019re only charged if the bounty reaches its goal and a robot is delivered.' });\n        if (!s.bpledge) bOpts = PLEDGES.map((p) => ({ label: p, pick: () => this.setState({ bpledge: p }) }));\n        else {\n          msgs.push({ kind: 'me', text: s.bpledge });\n          msgs.push({ kind: 'ai', text: 'Here\u2019s the bounty I\u2019ll post: \u201c' + bTitle + '\u201d. Specifics: ' + bSpec.join('; ') + '. Your pledge: ' + s.bpledge + '. Post it?' });\n          if (s.bflow !== 'posted') {\n            const pNum = parseFloat((s.bpledge || '').replace(/[^0-9.]/g, '')) || 0;\n            if (s.bposting) msgs.push({ kind: 'note', text: 'Posting your bounty\u2026' });\n            else if (s.bErr) msgs.push({ kind: 'ai', text: 'I couldn\u2019t post it: ' + s.bErr });\n            bOpts = s.bposting ? [] : [\n              { label: s.bErr ? 'Try again' : 'Post bounty', pick: () => {\n                this.setState({ bposting: true, bErr: '' });\n                postReal({ title: bTitle, specLines: bSpec, gaps: s.bgap ? [s.bgap.slice(0, 100)] : [], pledged: pNum, task: bStepRow ? bStepRow.task : (topicText || query), stepCost: bStepRow ? bStepRow.annualCost : null })\n                  .then(() => this.setState({ bflow: 'posted', bposting: false }))\n                  .catch((e) => this.setState({ bposting: false, bErr: errText(e) }));\n              } },\n              { label: 'Change what\u2019s missing', pick: () => this.setState({ bgap: '', bpledge: '', bErr: '' }) }\n            ];\n          } else {\n            msgs.push({ kind: 'me', text: 'Post bounty' });\n            msgs.push({ kind: 'note', text: 'Bounty posted \u00b7 see the top of Bounties' });\n            msgs.push({ kind: 'ai', text: 'Done. Your bounty is live at the top of Bounties. I\u2019ll invite companies with the same need and tell you when an engineering team claims it.' });\n          }\n        }\n      }\n    }\n    const wfBusy = !!W && (W.status === 'splitting' || wsteps.some((x) => x.verdict === 'checking'));\n    let quickList = bOpts ? bOpts : [];\n    if (!s.bflow && W && W.status === 'ready' && !wfBusy) {\n      quickList = wsteps.filter((x) => x.verdict === 'possible').slice(0, 2).map((x) => ({ label: 'Start a bounty: ' + x.name, pick: () => startStepBounty(x) }));\n    }\n\n    // ---------- the job's steps and their matches, from the Rivet agent ----------\n    const SF = [['people', 'People & pets'], ['traffic', 'Traffic'], ['chem', 'Chemicals'], ['heights', 'Heights'], ['quiet', 'Quiet hours'], ['fence', 'Property lines']];\n    const passes = (p) => {\n      const f = s.f;\n      if (f.budget !== 'any' && typeof p.price === 'number' && p.price > Number(f.budget) * 1000) return false;\n      if (f.payback !== 'any' && typeof p.paybackMonths === 'number' && p.paybackMonths > Number(f.payback)) return false;\n      return true;\n    };\n    const groups = wsteps\n      .filter((st) => st.picks.length > 0 && (s.stepFilter === null || s.stepFilter === st.index))\n      .map((st) => ({ st: st, picks: st.picks.filter(passes), all: st.
