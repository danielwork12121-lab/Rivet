<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Robot Bounty Client Flow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: work-order style. Sticky step bar on top, one screen per step, filter rail + results on search. */
:root {
  --bg: #F3F5EF;
  --surface: #FFFFFF;
  --sunk: #E8ECE2;
  --ink: #18241C;
  --muted: #5B6A5F;
  --line: #CDD5C8;
  --accent: #1E5B3A;
  --accent-ink: #FFFFFF;
  --hivis: #F0B400;
  --hivis-ink: #1B1A12;
  --good: #1E7A45;
  --warn: #A86500;
  --bad: #B23A2E;
  --good-bg: #E1F1E6;
  --warn-bg: #FBEFD6;
  --bad-bg: #F8E1DE;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111813; --surface: #18211B; --sunk: #202B23; --ink: #E6ECE4; --muted: #9AAA9E; --line: #304035;
    --accent: #5FBF86; --accent-ink: #0D1A12; --hivis: #F3C230; --hivis-ink: #1B1A12;
    --good: #6CCB91; --warn: #E8B04A; --bad: #EE8A7E; --good-bg: #1C3325; --warn-bg: #362B12; --bad-bg: #3A1F1B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111813; --surface: #18211B; --sunk: #202B23; --ink: #E6ECE4; --muted: #9AAA9E; --line: #304035;
  --accent: #5FBF86; --accent-ink: #0D1A12; --hivis: #F3C230; --hivis-ink: #1B1A12;
  --good: #6CCB91; --warn: #E8B04A; --bad: #EE8A7E; --good-bg: #1C3325; --warn-bg: #362B12; --bad-bg: #3A1F1B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; line-height: 1.1; text-wrap: balance; margin: 0; }
h1 { font-size: 2.1rem; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.2rem; }
p { margin: 0; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 1120px; margin: 0 auto; padding-block: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 1.35rem; font-weight: 700; }
.brand-mark { width: 28px; height: 28px; border-radius: 6px; background: var(--hivis); color: var(--hivis-ink); display: grid; place-items: center; font-size: .95rem; }
.sample-tag { font-size: .7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; padding: 2px 8px; border-radius: 99px; background: var(--warn-bg); color: var(--warn); }
.steps { display: flex; gap: 4px; list-style: none; margin: 0; padding: 0; overflow-x: auto; flex: 1 0 auto; max-width: 100%; min-width: 0; }
.steps button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 6px; font-size: .85rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
.steps button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.steps button .n { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid currentColor; display: grid; place-items: center; font-size: .72rem; font-family: var(--mono); }
.steps button[aria-current="step"] { color: var(--ink); background: var(--sunk); }
.steps button[aria-current="step"] .n { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.steps button.done .n { background: var(--sunk); }

main { max-width: 1120px; margin: 0 auto; padding-block: 28px 64px; }
.screen-head { display: grid; gap: 6px; margin-bottom: 22px; max-width: 70ch; }

/* Generic pieces */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 20px; align-items: start; }
.stack { display: grid; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.field { display: grid; gap: 5px; }
.field label { font-size: .85rem; font-weight: 600; }
.field .hint { font-size: .78rem; color: var(--muted); }
input[type="text"], input[type="number"], select, textarea {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%;
}
textarea { min-height: 96px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.fields3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.btn { font: inherit; font-weight: 600; cursor: pointer; border-radius: 6px; padding: 9px 16px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.btn:hover { background: var(--sunk); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.hivis { background: var(--hivis); border-color: var(--hivis); color: var(--hivis-ink); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.small { padding: 6px 12px; font-size: .85rem; }
.link { all: unset; cursor: pointer; color: var(--accent); font-weight: 600; font-size: .88rem; text-decoration: underline; text-underline-offset: 3px; }
.link:focus-visible { outline: 2px solid var(--accent); }
.chip { font: inherit; font-size: .85rem; cursor: pointer; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: .74rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.plain { background: var(--sunk); color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-top: 22px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { all: unset; cursor: pointer; padding: 7px 14px; font-weight: 600; font-size: .88rem; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* Intake */
.voice { display: flex; gap: 12px; align-items: center; padding: 12px; border: 1px dashed var(--line); border-radius: 8px; background: var(--bg); }
.mic { width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--hivis); color: var(--hivis-ink); cursor: pointer; display: grid; place-items: center; flex: none; }
.mic:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mic svg { width: 20px; height: 20px; }
.radio-card { display: flex; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; align-items: flex-start; }
.radio-card:has(input:checked) { border-color: var(--accent); background: var(--good-bg); }
.radio-card input { margin-top: 3px; accent-color: var(--accent); }

/* Chat */
.chat { display: grid; gap: 12px; }
.msg { max-width: 560px; padding: 10px 14px; border-radius: 12px; }
.msg.ai { background: var(--surface); border: 1px solid var(--line); border-top-left-radius: 3px; }
.msg.me { background: var(--accent); color: var(--accent-ink); justify-self: end; border-top-right-radius: 3px; }
.msg .who { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 2px; opacity: .75; }
.assump { display: grid; gap: 8px; }
.assump div { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 6px; border-bottom: 1px dotted var(--line); font-size: .9rem; }

/* Opportunities */
.opps { display: grid; gap: 14px; }
.opp { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 24px; align-items: center; }
.opp-stats { display: grid; grid-template-columns: repeat(3, minmax(92px, auto)); gap: 18px; text-align: right; }
.opp-stats .v { font-family: var(--mono); font-size: 1.15rem; font-weight: 500; }
.bar { height: 8px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); }
@media (max-width: 720px) { .opp { grid-template-columns: 1fr; } .opp-stats { text-align: left; grid-template-columns: repeat(3, 1fr); } }

/* Search */
.search { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 820px) { .search { grid-template-columns: 1fr; } }
.filters { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); }
@media (max-width: 820px) { .filters { position: static; } }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.results { display: grid; gap: 12px; }
.prod { display: grid; gap: 10px; }
.prod-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; align-items: baseline; }
.prod-figs { display: flex; flex-wrap: wrap; gap: 8px 22px; }
.prod-figs div { display: grid; }
.prod-figs .v { font-family: var(--mono); font-weight: 500; }
.why { font-size: .9rem; padding: 8px 12px; background: var(--good-bg); color: var(--ink); border-radius: 6px; }
.why b { color: var(--good); }
.ruled { font-size: .88rem; padding: 8px 12px; background: var(--bad-bg); border-radius: 6px; }
.contact { font-family: var(--mono); font-size: .85rem; padding: 8px 12px; background: var(--sunk); border-radius: 6px; user-select: all; }
.rank { font-family: var(--display); font-size: 1.6rem; color: var(--muted); line-height: 1; }
.empty { padding: 28px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); }

/* Bounty */
.spec { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.pledge-big { font-family: var(--mono); font-size: 2rem; font-weight: 500; }
.progress { height: 14px; border-radius: 99px; background: var(--sunk); overflow: hidden; display: flex; }
.progress .others { background: var(--accent); }
.progress .mine { background: var(--hivis); }
.backers { display: grid; gap: 0; }
.backer { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.backer:last-child { border-bottom: none; }
.callout { padding: 14px 16px; border-radius: 8px; background: var(--warn-bg); display: grid; gap: 4px; }
.notice { padding: 12px 14px; border-radius: 8px; background: var(--bad-bg); font-size: .9rem; }
.bounty-hero { display: grid; gap: 14px; }
.bounty-stats { display: flex; flex-wrap: wrap; gap: 14px 32px; }
.bounty-stats .v { font-family: var(--mono); font-size: 1.4rem; font-weight: 500; }

/* Developer side */
.role button[aria-pressed="true"] { background: var(--hivis); color: var(--hivis-ink); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: .76rem; padding: 2px 8px; border-radius: 4px; background: var(--sunk); color: var(--ink); }
.tag.have { background: var(--good-bg); color: var(--good); }
.tag.miss { background: var(--bad-bg); color: var(--bad); }
.status { padding: 12px 14px; border-radius: 8px; display: grid; gap: 2px; font-size: .9rem; }
.status.good { background: var(--good-bg); }
.status.warn { background: var(--warn-bg); }
.status b { font-family: var(--display); font-size: 1.15rem; letter-spacing: .01em; }
.ms { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 4px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.ms:last-child { border-bottom: none; }
.ms .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: .75rem; font-family: var(--mono); color: var(--muted); }
.ms.done .dot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ms.next .dot { border-color: var(--hivis); color: var(--ink); }
.update { display: grid; gap: 2px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
.update:last-child { border-bottom: none; }
.check { display: flex; gap: 8px; align-items: center; font-size: .88rem; }
.check input { accent-color: var(--accent); }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: .9rem; z-index: 20; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .screen { animation: in .18s ease-out; } @keyframes in { from { transform: translateY(4px); } to { transform: none; } } }
</style>

<header class="top gutter">
  <div class="top-inner">
    <div class="brand"><span class="brand-mark" aria-hidden="true">RB</span>Robot Bounty <span class="sample-tag">Prototype · sample data</span></div>
    <div class="seg role" id="role" role="group" aria-label="Viewing as"><button data-role="client">Client</button><button data-role="dev">Developer</button></div>
    <ol class="steps" id="steps"></ol>
  </div>
</header>
<main class="gutter" id="app"></main>
<div class="toast" id="toast" role="status" hidden></div>

<script src="js/rivet-api.js"></script>
<script>
// ---------- Data (all sample / illustrative) ----------
const COMPANY = {
  lawn: {
    label: "Lawn care",
    name: "Green Acres Lawn Co.",
    describe: "We mow and treat about 120 residential and small commercial lawns a week around Sacramento. 3 crews of 2 guys. Mowing takes most of the day, then edging and trimming, and we spray fertilizer and weed control on a monthly route.",
    voice: "So we've got three crews, two guys each. Mowing is like most of the day, edging and trimming after. Once a month we spray fert and weed control on every property. Hardest part is finding people who'll stay the whole season.",
    tasks: [
      { id: "mow", robot: "Autonomous mower", name: "Mowing open turf", hours: 22, share: .7, note: "Large flat areas are the easiest work to hand to a robot." },
      { id: "spray", robot: "Fertilizer spraying robot", name: "Fertilizer and weed spraying", hours: 6, share: .6, note: "Repeatable routes with a known chemical load." },
      { id: "trim", robot: "Edging and trimming robot", name: "Edging and trimming", hours: 8, share: .25, note: "Close to beds and fences, so robots only cover part of it today." },
    ],
  },
  pest: {
    label: "Pest control",
    name: "Valley Shield Pest Control",
    describe: "We service around 90 homes a week. 3 techs, each solo in a truck. Most of the time goes to perimeter spraying, then crawlspace inspections, and checking rodent bait stations on commercial accounts.",
    voice: "Three techs, each in their own truck. Perimeter spray is the bulk of it. Crawlspaces are the job nobody wants. Bait stations on the commercial accounts eat a ton of time walking around buildings.",
    tasks: [
      { id: "perim", robot: "Perimeter spraying robot", name: "Perimeter spraying", hours: 14, share: .55, note: "Same pattern around every house." },
      { id: "crawl", robot: "Crawlspace inspection robot", name: "Crawlspace inspection", hours: 5, share: .7, note: "Tight, dirty, and a common source of injuries." },
      { id: "bait", robot: "Bait station checking robot", name: "Bait station checks", hours: 6, share: .5, note: "Walking routes around commercial buildings." },
    ],
  },
};

const PRODUCTS = [
  { id: "p1", task: "mow", name: "TurfRover R2", maker: "Sample Robotics Co. A", price: 18500, opex: 1200, share: .7, slope: 20, regions: ["West", "South"], trl: 9 },
  { id: "p2", task: "mow", name: "Fieldline AutoMow Pro", maker: "Sample Robotics Co. B", price: 32000, opex: 2000, share: .8, slope: 30, regions: ["West", "South", "Midwest", "Northeast"], trl: 8 },
  { id: "p3", task: "mow", name: "GreenPath Compact", maker: "Sample Robotics Co. C", price: 6900, opex: 600, share: .4, slope: 15, regions: ["West", "Midwest", "Northeast"], trl: 9 },
  { id: "p4", task: "trim", name: "EdgeBot E1", maker: "Sample Robotics Co. D", price: 14000, opex: 1500, share: .3, slope: 10, regions: ["West", "South", "Midwest", "Northeast"], trl: 6 },
  { id: "p5", task: "spray", name: "SprayScout S", maker: "Sample Robotics Co. E", price: 21000, opex: 1800, share: .6, slope: 15, regions: ["West", "South"], trl: 7 },
  { id: "p6", task: "spray", name: "TankWalker T3", maker: "Sample Robotics Co. F", price: 27500, opex: 2400, share: .65, slope: 25, regions: ["West", "South", "Midwest"], trl: 7 },
  { id: "p7", task: "perim", name: "PerimeterPro Rover", maker: "Sample Robotics Co. G", price: 24000, opex: 2200, share: .5, slope: 20, regions: ["West", "South", "Midwest", "Northeast"], trl: 7 },
  { id: "p8", task: "crawl", name: "CrawlEye C2", maker: "Sample Robotics Co. H", price: 9800, opex: 700, share: .7, slope: 35, regions: ["West", "South", "Midwest", "Northeast"], trl: 8 },
  { id: "p9", task: "crawl", name: "UnderView Mini", maker: "Sample Robotics Co. I", price: 4200, opex: 300, share: .45, slope: 25, regions: ["South", "Midwest"], trl: 9 },
];

const QUESTIONS = [
  { key: "slope", q: "How many of your properties have slopes steeper than about 20°?", opts: [["Very few", 15], ["Some", 20], ["A lot of them", 28]] },
  { key: "obstacles", q: "Are most sites wide open, or full of beds, toys, fences and other obstacles?", opts: [["Mostly open", 1], ["Mixed", .85], ["Lots of obstacles", .7]] },
  { key: "weeks", q: "How many weeks a year are your crews out working?", opts: [["About 26", 26], ["About 32", 32], ["Most of the year (45)", 45]] },
];

const GAPS = ["Too expensive", "Can't handle slopes", "Not sold in my region", "Doesn't do the whole job", "Too slow for my route"];

const STEP_NAMES = ["Describe your work", "AI follow-ups", "Opportunities", "Find robots", "Bounty"];

// ---------- State ----------
const S = {
  step: 0,
  type: "lawn",
  name: COMPANY.lawn.name,
  describe: COMPANY.lawn.describe,
  crews: 3, perCrew: 2, wage: 24, region: "West",
  visibility: "shared",
  answers: { slope: 20, obstacles: .85, weeks: 32 },
  answered: 0,
  view: "ai",
  filters: { maxPrice: 35000, maxPayback: 48, task: "all" },
  contacts: {},
  bounty: null,
  gaps: new Set(["Can't handle slopes"]),
  gapNote: "",
  pledgePct: 30,
  posted: false,
  invited: false,
  // Backend save state for the step 1 intake (see submitIntake). Follow-up answers,
  // search filters and the bounty are NOT saved yet.
  submit: { status: "idle", id: null, fp: "", attemptFp: "", token: "", error: "", errorFp: "" },
};

// ---------- Math (deterministic) ----------
const money = n => "$" + Math.round(n).toLocaleString("en-US");
const months = y => isFinite(y) && y > 0 ? Math.round(y * 12) + " mo" : "never";
const people = () => S.type === "lawn" ? S.crews * S.perCrew : S.crews;
const tasks = () => COMPANY[S.type].tasks;
const taskById = id => tasks().find(t => t.id === id);
function laborCost(t) { return t.hours * S.crews * (S.type === "lawn" ? S.perCrew : 1) * S.answers.weeks * S.wage; }
function evalProduct(p) {
  const t = taskById(p.task);
  const units = S.crews;
  const upfront = p.price * units;
  const savings = laborCost(t) * p.share * S.answers.obstacles;
  const opex = p.opex * units;
  const net = savings - opex;
  const payback = net > 0 ? upfront / net : Infinity;
  const fails = [];
  if (p.slope < S.answers.slope) fails.push(`Handles slopes up to ${p.slope}°, your sites need about ${S.answers.slope}°`);
  if (!p.regions.includes(S.region)) fails.push(`Not sold or serviced in the ${S.region}`);
  if (payback > 5) fails.push(isFinite(payback) ? `Takes about ${Math.round(payback)} years to pay back for a company your size` : "Running costs are higher than the labor it saves");
  const lo = net * 0.8 > 0 ? upfront / (net * 0.8) : Infinity;
  const hi = upfront / (net * 1.2);
  return { p, t, units, upfront, savings, opex, net, payback, fails, lo, hi };
}
function productsForMe() { return PRODUCTS.filter(p => tasks().some(t => t.id === p.task)).map(evalProduct); }
function bestForTask(t) {
  const fit = productsForMe().filter(e => e.p.task === t.id && !e.fails.length && isFinite(e.payback));
  fit.sort((a, b) => a.payback - b.payback);
  return fit[0];
}
function bountyBasis(t) { return laborCost(t) * .6 * S.answers.obstacles; } // target robot takes 60% of the task

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); }

// Save the step 1 intake to Convex before moving on. Success is only shown after
// Convex confirms the write. See js/rivet-api.js for the field mapping.
const fingerprint = () => JSON.stringify(RivetApi.intakeToRequest(S));
function intakeStatus() {
  const u = S.submit;
  if (u.status === "error" && u.errorFp === fingerprint()) return `<div class="notice" role="alert" style="flex:1 1 220px;align-self:center">${esc(u.error)}</div>`;
  if (u.id && u.fp === fingerprint()) return `<span class="hint" style="flex:1 1 220px;align-self:center" role="status">Saved to Rivet \u00b7 ref ${esc(u.id.slice(-6))}</span>`;
  return "";
}
async function submitIntake(target) {
  const u = S.submit;
  if (u.status === "saving") return; // repeated clicks
  const args = RivetApi.intakeToRequest(S), fp = JSON.stringify(args);
  const problem = RivetApi.precheck(S);
  if (problem) { u.status = "error"; u.error = problem; u.errorFp = fp; render(); return; }
  if (u.id && u.fp === fp) { go(target); return; } // already saved, nothing changed
  if (u.attemptFp !== fp) { u.token = RivetApi.newClientToken(); u.attemptFp = fp; } // same token on retry => no duplicate
  u.status = "saving"; u.error = ""; render();
  try {
    const id = await RivetApi.createRequest({ ...args, clientToken: u.token });
    u.id = id; u.fp = fp; u.status = "saved"; RivetApi.saveId(id);
    if (fingerprint() !== fp) { render(); toast("Saved. You changed something while saving, so press Continue again."); return; }
    toast("Request saved"); go(target);
  } catch (e) {
    u.status = "error"; u.error = RivetApi.friendlyError(e); u.errorFp = fp; render();
  }
}
// Client stepper: leaving step 1 forward saves first, like the Continue button.
function navTo(step) { S.step === 0 && step > 0 ? submitIntake(step) : go(step); }
// After a refresh, reload the saved request by id and refill the form.
async function hydrateSaved() {
  const id = RivetApi.loadSavedId();
  if (!id) return;
  const startFp = fingerprint();
  try {
    const doc = await RivetApi.getRequest(id);
    if (!doc) { RivetApi.clearSavedId(); return; }
    const p = RivetApi.requestToIntake(doc);
    if (!p || !Object.hasOwn(COMPANY, p.type) || !REGIONS.includes(p.region)) return;
    if (S.step !== 0 || fingerprint() !== startFp) return; // user already started editing
    Object.assign(S, p);
    S.submit = { status: "saved", id, fp: fingerprint(), attemptFp: fingerprint(), token: doc.clientToken || "", error: "", errorFp: "" };
    render(); toast("Restored your saved request");
  } catch (e) { /* backend unreachable: keep the blank form; the saved id stays in storage */ }
}

// Step 5
function startBounty(taskId, product) {
  S.bounty = { taskId, product: product ? product.name : null };
  S.posted = false; S.invited = false;
  S.gaps = new Set();
  if (product) {
    const e = evalProduct(product);
    if (e.fails.some(f => f.startsWith("Handles slopes"))) S.gaps.add("Can't handle slopes");
    if (e.fails.some(f => f.startsWith("Not sold"))) S.gaps.add("Not sold in my region");
    if (!S.gaps.size) S.gaps.add("Too expensive");
  } else S.gaps.add("Doesn't do the whole job");
  go(4);
}
function bountyTitle() {
  const t = taskById(S.bounty.taskId);
  const bits = [];
  if (S.gaps.has("Can't handle slopes")) bits.push(`for ${S.answers.slope}° slopes`);
  if (S.gaps.has("Too expensive")) bits.push("under $15k");
  return `${t.robot} ${bits.join(", ")}`.trim();
}
function specLines() {
  const t = taskById(S.bounty.taskId);
  const L = [`Takes over at least 60% of ${t.name.toLowerCase()} on ${S.type === "lawn" ? "residential and small commercial lawns" : "residential and light commercial properties"}`];
  if (S.gaps.has("Can't handle slopes")) L.push(`Works on slopes up to ${S.answers.slope}°`);
  if (S.gaps.has("Too expensive")) L.push("Target unit price under $15,000");
  if (S.gaps.has("Not sold in my region")) L.push(`Sold and serviced in the ${S.region}`);
  if (S.gaps.has("Doesn't do the whole job")) L.push("Handles the full job without a person following it");
  if (S.gaps.has("Too slow for my route")) L.push("Keeps pace with a crew's daily route");
  if (S.answers.obstacles < 1) L.push("Navigates around beds, fences and yard clutter");
  if (S.gapNote.trim()) L.push(esc(S.gapNote.trim()));
  return L;
}

function claimedMine() { return S.claim && S.claim.bountyId === "mine"; }
function clientPledge() { return S.posted && S.bounty ? bountyBasis(taskById(S.bounty.taskId)) * S.pledgePct / 100 : 15500; }
function mineBounty() {
  const live = !!(S.posted && S.bounty);
  const taskId = live ? S.bounty.taskId : "mow";
  const skills = [...TASK_SKILLS[taskId]];
  if (live && S.gaps.has("Can't handle slopes") && !skills.includes("Slope traction")) skills.push("Slope traction");
  return {
    id: "mine", live, skills, closes: "Jan 31", backers: 4,
    title: live ? bountyTitle() : "Autonomous mower for 20° slopes",
    industry: live ? COMPANY[S.type].label : "Lawn care", cat: CATEGORY[taskId], region: live ? S.region : "West",
    pledged: OTHERS.reduce((s, o) => s + o.amt, 0) + clientPledge(), goal: 150000,
    specs: live ? specLines() : ["Takes over at least 60% of mowing open turf on residential and small commercial lawns", "Works on slopes up to 20°", "Navigates around beds, fences and yard clutter"],
  };
}
function allBounties() { return [mineBounty(), ...SAMPLE_BOUNTIES]; }
function bountyById(id) { return allBounties().find(b => b.id === id); }
const isMyClaim = b => S.claim && S.claim.bountyId === b.id;
const raisedOf = b => b.pledged + (isMyClaim(b) ? S.extra : 0);
const targetOf = b => isMyClaim(b) ? S.claim.price : b.goal;
const backersOf = b => b.backers + (isMyClaim(b) && S.extra ? 2 : 0);
const reservedByOther = b => b.reservedBy && !isMyClaim(b);
function match(b) {
  const have = b.skills.filter(s => S.dev.skills.has(s));
  const missing = b.skills.filter(s => !S.dev.skills.has(s));
  const inRegion = S.dev.regions.has(b.region);
  const funded = raisedOf(b) / targetOf(b);
  return { have, missing, inRegion, funded, score: .6 * have.length / b.skills.length + .2 * (inRegion ? 1 : 0) + .2 * Math.min(funded, 1) };
}
function devReason(b, m) {
  const lc = a => a.map(s => s.toLowerCase()).join(", ");
  let r = `You've built ${m.have.length} of the ${b.skills.length} capabilities it needs${m.have.length ? ` (${lc(m.have)})` : ""}`;
  if (m.missing.length) r += `; you'd still need ${lc(m.missing)}`;
  return r + `. ${m.inRegion ? "It's in a region you serve" : "It's outside the regions you serve"}, and it's ${Math.round(m.funded * 100)}% funded by ${backersOf(b)} companies.`;
}
function goDev(step) { S.dstep = step; render(); window.scrollTo({ top: 0 }); }

function screenBoard() {
  const f = S.dfilt;
  const list = allBounties().filter(b => (f.cat === "all" || b.cat === f.cat) && (f.region === "all" || b.region === f.region));
  let body;
  if (S.dview === "ai") {
    const open = list.filter(b => !reservedByOther(b)).map(b => [b, match(b)]).sort((a, c) => c[1].score - a[1].score);
    const taken = list.filter(reservedByOther);
    body = (open.length ? open.map(([b], i) => bountyCard(b, i + 1)).join("") : `<div class="empty">No open bounties match these filters.</div>`)
      + (taken.length ? `<h3 style="margin-top:12px">Reserved by other teams</h3>` + taken.map(b => bountyCard(b, null)).join("") : "");

    const shown = list.filter(b => raisedOf(b) >= f.minPledged && raisedOf(b) / targetOf(b) * 100 >= f.minFunded && (f.showReserved || !reservedByOther(b))).sort((a, c) => raisedOf(c) - raisedOf(a));
    body = shown.length ? shown.map(b => bountyCard(b, null)).join("") : `<div class="empty">Nothing matches these filters. Try lowering the pledged or funded minimum.</div>`;
  }
  const tip = !mineBounty().live ? `<p class="muted" style="font-size:.8rem">Tip: post a bounty on the Client side and it shows up here.</p>` : "";
  return `

      <div class="field"><label for="df-region">Region</label><select id="df-region"><option value="all">All regions</option>${REGIONS.map(r => `<option ${f.region === r ? "selected" : ""}>${r}</option>`).join("")}</select></div>

      </div>
      <div class="panel stack">
        <h3>Money behind it</h3>
        <div class="bar" aria-hidden="true"><span style="width:${Math.min(raised / b.goal * 100, 100)}%"></span></div>
        <div class="prod-figs"><div><span class="label">Pledged</span><span class="v">${money(raised)}</span></div><div><span class="label">Backers' goal</span><span class="v">${money(b.goal)}</span></div></div>
        <div class="why"><b>Fit:</b> ${devReason(b, m)}</div>
      </div>
    </div>
    <div class="panel stack">
      <h3>Your proposal</h3>
      <div class="fields3">
        <div class="field"><label for="c-price">Your price ($)</label><input id="c-price" type="number" min="1000" step="1000" value="${price}"></div>
        <div class="field"><label for="c-weeks">Weeks to deliver</label><input id="c-weeks" type="number" min="1" value="${S.draftWeeks ?? 12}"></div>
      </div>
      <div class="field"><label for="c-approach">Approach</label><textarea id="c-approach">${esc(S.draftApproach ?? `Adapt our existing robot platform${m.have.length ? ` (${m.have.map(s => s.toLowerCase()).join(", ")})` : ""} to this spec${m.missing.length ? ` and add ${m.missing.map(s => s.toLowerCase()).join(" and ")}` : ""}. Field-test with two backers' crews before shipping.`)}</textarea></div>
      <div class="field"><span class="label">Milestones (backers see each update)</span>${ms.map((t, i) => `<input type="text" data-ms="${i}" aria-label="Milestone ${i + 1}" value="${esc(t)}">`).join("")}</div>
      <div id="c-status">${claimStatus(price, raised)}</div>
      <p class="muted" style="font-size:.85rem">Claiming reserves this bounty for your team for 14 days, until Nov 7. Post your first milestone update by then or it reopens to other teams.</p>
      ${other ? `<div class="notice">You already hold a claim on "${esc(other.title)}". Claiming this one releases it.</div>` : ""}
      <button class="btn hivis" id="claim">Claim for ${money(price)}</button>
    </div>
  </div>
  <div class="actions"><button class="btn" id="back">Back to board</button></div>`;
}
function bindClaim() {
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on("#toboard", () => goDev(1));
  on("#back", () => goDev(1));
  if (!$("#claim")) return;
  const b = bountyById(S.sel);
  $("#c-price").oninput = e => { S.draftPrice = Math.max(1000, +e.target.value || 0); $("#c-status").innerHTML = claimStatus(S.draftPrice, raisedOf(b)); $("#claim").textContent = "Claim for " + money(S.draftPrice); };
  $("#c-weeks").oninput = e => S.draftWeeks = Math.max(1, +e.target.value || 1);
  $("#c-approach").oninput = e => S.draftApproach = e.target.value;
  document.querySelectorAll("[data-ms]").forEach(i => i.oninput = e => S.draftMs[+i.dataset.ms] = e.target.value);
  $("#claim").onclick = () => {
    if (S.claim && S.claim.bountyId !== b.id) toast("Released your earlier claim");
    S.claim = { bountyId: b.id, price: S.draftPrice, weeks: S.draftWeeks ?? 12, approach: $("#c-approach").value,
      milestones: S.draftMs.map(t => ({ title: t, done: false, update: "" })) };
    S.extra = 0; S.delivered = false; S.confirmed = false;
    S.draftPrice = S.draftWeeks = S.draftApproach = S.draftMs = undefined;
    goDev(3); toast("Bounty claimed. Reserved for 14 days");
  };
}

// Dev step 4: build & deliver
const SAMPLE_UPDATES = [
  "Prototype ran a full test lot. Holding its line on a 22° slope, battery lasted 3.5 hours.",
  "Two backers' crews ran it on real routes for a week. It handled 68% of mowing time; we're fixing a snag near flower beds.",
  "Production units built and shipped. Each backer gets setup help from our team on site.",
];
function msDate(i) { return `Week ${Math.round(S.claim.weeks * (i + 1) / S.claim.milestones.length)}`; }
function screenDeliver() {
  if (!S.claim) return `<div class="screen-head"><span class="label">Developer · Step 4 of 4</span><h1>No claim yet</h1><p class="muted">Claim a bounty from the board to start building.</p></div><div class="actions" style="justify-content:flex-start"><button class="btn primary" id="toboard">Go to bounty board</button></div>`;
  const c = S.claim, b = bountyById(c.bountyId), raised = raisedOf(b), funded = raised >= c.price;
  const next = c.milestones.findIndex(m => !m.done);
  const started = c.milestones.some(m => m.done);
  let final;
  if (S.confirmed) final = `<div class="status good"><b>Paid out</b><span>Backers confirmed delivery. ${money(c.price)} was charged across ${backersOf(b)} backers and paid to ${esc(S.dev.team)}.</span></div>`;
  else if (S.delivered && !funded) final = `<div class="status warn"><b>Delivered, waiting on pledges</b><span>Pledges need to reach your price before anyone is charged.</span></div>`;
  else if (S.delivered) final = `<div class="status warn"><b>Delivered, waiting for backers to confirm</b><span>Each backer checks the robot meets the spec.</span></div><button class="btn primary" id="confirm">Simulate backers confirming</button>`;
  else final = `<button class="btn hivis" id="deliver" ${next !== -1 ? "disabled" : ""}>Mark robot delivered</button>${next !== -1 ? `<p class="muted" style="font-size:.85rem">Finish every milestone first.</p>` : ""}`;
  return `
  <div class="screen-head">
    <span class="label">Developer · Step 4 of 4 · Build &amp; deliver</span>
    <h1>${esc(b.title)}</h1>
    <div class="row"><span class="pill ${started ? "good" : "warn"}">${started ? "Claim locked in" : "Reserved for you until Nov 7"}</span><span class="pill plain">${esc(S.dev.team)} · ${money(c.price)} · ${c.weeks} weeks</span></div>
  </div>
  <div class="grid2">
    <div class="panel stack">
      <h3>Milestones</h3>
      <p class="muted" style="font-size:.88rem">Each update you post shows on the bounty page every backer sees.</p>
      <div>${c.milestones.map((m, i) => `
        <div class="ms ${m.done ? "done" : i === next ? "next" : ""}">
          <span class="dot">${m.done ? "✓" : i + 1}</span>
          <div class="stack" style="gap:6px"><b>${esc(m.title)}</b>
          ${m.done ? `<span class="muted" style="font-size:.88rem">${esc(m.update)} · ${msDate(i)}</span>` : i === next ? `<textarea id="u-text" aria-label="Update for ${esc(m.title)}" style="min-height:70px">${esc(SAMPLE_UPDATES[i] || "")}</textarea><div><button class="btn small primary" id="post-u">Post update</button></div>` : ""}</div>
        </div>`).join("")}</div>
    </div>
    <div class="stack">
      <div class="panel stack">
        <h3>Funding</h3>
        <div class="bar" aria-hidden="true"><span style="width:${Math.min(raised / c.price * 100, 100)}%"></span></div>
        <div class="prod-figs"><div><span class="label">Pledged</span><span class="v">${money(raised)}</span></div><div><span class="label">Your price</span><span class="v">${money(c.price)}</span></div><div><span class="label">Backers</span><span class="v">${backersOf(b)}</span></div></div>
        ${claimStatus(c.price, raised)}
        ${!funded ? `<button class="btn" id="more">Simulate 2 new backers (+${money(c.price - raised)})</button>` : ""}
      </div>
      <div class="panel stack"><h3>Delivery</h3>${final}</div>
      ${b.id === "mine" && b.live ? `<button class="link" id="asclient">See the bounty page as a backer</button>` : ""}
    </div>
  </div>`;
}
function bindDeliver() {
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on("#toboard", () => goDev(1));
  on("#post-u", () => { const c = S.claim, i = c.milestones.findIndex(m => !m.done); c.milestones[i].done = true; c.milestones[i].update = $("#u-text").value; render(); toast("Update posted to backers"); });
  on("#more", () => { const b = bountyById(S.claim.bountyId); S.extra += S.claim.price - raisedOf(b); render(); toast("2 new backers joined"); });
  on("#deliver", () => { S.delivered = true; render(); });
  on("#confirm", () => { S.confirmed = true; render(); toast("Backers confirmed. Payout sent"); });
  on("#asclient", () => { S.role = "client"; go(4); });
}

function devUpdatesHtml() {
  if (!claimedMine()) return `<div class="empty" style="padding:18px">No developer has taken this on yet. Robotics teams see the spec and the pooled total, and post updates here once they start.</div>`;
  const c = S.claim, done = c.milestones.filter(m => m.done);
  const state = S.confirmed ? `<span class="pill good">Delivered &amp; paid</span>` : S.delivered ? `<span class="pill warn">Delivered · confirm it meets the spec</span>` : `<span class="pill warn">Claimed · building</span>`;
  return `<div class="row"><b>${esc(S.dev.team)}</b>${state}</div>
    <p class="muted" style="font-size:.88rem">Will build it for <span class="num">${money(c.price)}</span> in ${c.weeks} weeks. ${esc(c.approach)}</p>
    <div>${done.length ? done.map((m, i) => `<div class="update"><b>${esc(m.title)}</b><span>${esc(m.update)}</span><span class="muted" style="font-size:.8rem">${msDate(i)}</span></div>`).join("") : `<p class="muted" style="font-size:.88rem">No milestone updates yet.</p>`}</div>`;
}

// ---------- Main ----------
const SCREENS = [[screenIntake, bindIntake], [screenFollowups, bindFollowups], [screenOpps, bindOpps], [screenSearch, bindSearch], [screenBounty, bindBounty]];
const DEV_SCREENS = [[screenProfile, bindProfile], [screenBoard, bindBoard], [screenClaim, bindClaim], [screenDeliver, bindDeliver]];
function renderRole() {
  document.querySelectorAll("#role button").forEach(b => { b.setAttribute("aria-pressed", b.dataset.role === S.role); b.onclick = () => { S.role = b.dataset.role; render(); window.scrollTo({ top: 0 }); }; });
}
function render() {
  renderRole();
  const dev = S.role === "dev";
  const names = dev ? DEV_STEPS : STEP_NAMES, cur = dev ? S.dstep : S.step;
  $("#steps").innerHTML = names.map((n, i) =>
    `<li><button data-step="${i}" ${i === cur ? 'aria-current="step"' : ""} class="${i < cur ? "done" : ""}"><span class="n">${i + 1}</span>${n}</button></li>`).join("");
  $("#steps").querySelectorAll("button").forEach(b => b.onclick = () => dev ? goDev(+b.dataset.step) : navTo(+b.dataset.step)); // RIVET-BACKEND: save before leaving step 1
  const [html, bind] = (dev ? DEV_SCREENS : SCREENS)[cur];
  $("#app").innerHTML = `<div class="screen">${html()}</div>`;
  bind();
}
render();
hydrateSaved();
</script>

</body></html>
